# config/strategy.example.yaml — strukturelle Vorlage fuer config/strategy.yaml
#
# WICHTIG: Diese Datei ist NUR eine strukturelle Vorlage (Feldnamen, Typen,
# required/optional). Die hier gezeigten Werte sind Beispielwerte, KEINE
# persoenliche Strategie. Eine echte Strategie gehoert nach config/strategy.yaml
# (gitignored) und wird deterministisch aus config/setup/answers.reviewed.yaml
# erzeugt (scripts/setup_strategy.py --emit) — nicht von Hand gepflegt.
#
# Das erwartete Schema ist die Single Source of Truth in
# config/strategy.schema.yaml (eingecheckt, fail-closed bei unbekannten Feldern):
# - required: portfolio, satellite_limits (ohne sie koennen keine Checks laufen)
# - fail-closed: unbekannte Felder/Sektionen erzeugen Validierungsfehler
# - Validierung: core_pct + satellite_pct == 100, max_position_pct <= max_sector_pct,
#   max_positions >= 1, max_trades_per_quarter >= 1, Typ-Pruefung, Datumsformat
# - Ungueltige/fehlende config/strategy.yaml -> fail-closed (kein Versand, Alert)
#
# Technische Schnittstellen-Doku: docs/strategy-interface.md
# Menschenlesbare Governance-Strategie: strategy/strategy.md (lokal generiert,
# nicht versioniert; öffentliche Vorlage ist diese Datei)

# optional — Metadaten der Strategie
meta:
  version: 1                      # int — Versionsnummer der Strategie
  created: "2026-08-06"           # date (YYYY-MM-DD) — Erstellungsdatum
  last_reviewed: "2026-08-06"     # date (YYYY-MM-DD) — letztes Review
  next_review: "2026-11-06"       # date (YYYY-MM-DD) — naechstes Review
  cooling_off_days: 30            # int — Abkuehlfrist bei Strategieaenderungen

# optional — Anlegerprofil (rein informativ, keine Pipeline-Checks)
investor:
  horizon: ">15y"                 # str — Anlagehorizont
  income_source: "monthly_savings"  # str — Einkommensquelle
  purpose: "retirement"           # str — Sparziel
  risk_profile: "moderate"        # str — Risikoprofil

# required — Portfolio-Struktur und Zielquote (Basis fuer Core/Satellite-Checks)
portfolio:
  core_pct: 75.0                  # int|float (%) — Core-Zielquote; gelesen von
                                  #   calculate_core_satellite, calculate_drift
  satellite_pct: 25.0             # int|float (%) — Satellite-Zielquote;
                                  #   muss mit core_pct zusammen 100 ergeben
  core_description: "FTSE All-World (Acc)"  # str — Beschreibung des Cores
  rebalancing:                    # optional — Rebalancing-Toleranz
    method: "threshold"           # str — Methode (z. B. "threshold")
    threshold_pct: 5.0            # int|float (pp) — Toleranzband; gelesen von
                                  #   calculate_core_satellite, calculate_drift

# required — Grenzwerte fuer Satellite-Positionen
satellite_limits:
  max_position_pct: 5.0           # int|float (%) — max. Einzelposition; gelesen von
                                  #   calculate_single_position_max
  max_sector_pct: 15.0            # int|float (%) — max. Sektor-Konzentration; gelesen von
                                  #   calculate_sector_concentration; muss >= max_position_pct sein
  max_positions: 10               # int — max. Anzahl Satellite-Positionen; muss >= 1 sein
  max_turnover_annual_pct: 30.0   # int|float (%) — max. Jahresumschlag; gelesen von
                                  #   calculate_turnover
  max_trades_per_quarter: 3       # int — max. Trades pro Quartal

# optional — Sektor-Praeferenzen (kein harter Pipeline-Check)
sectors:
  preferred: ["technology", "healthcare"]  # list[str] — bevorzugte Sektoren
  excluded: ["tobacco", "fossil_fuels"]    # list[str] — ausgeschlossene Sektoren
  notes: ""                       # str — freie Notizen

# optional — Regionen-Limits (kein harter Pipeline-Check)
regions:
  core: "global"                  # str — Core-Region
  satellite_restriction: "none"   # str — Satellite-Einschraenkung

# optional — Thesis-Anforderungen
thesis:
  required: true                  # bool — Thesis vor Satellite-Kauf Pflicht
  template: "thesis_template.md"  # str — Vorlage-Dateiname

# optional — Alert-/Warn-Konfiguration (frei; gelesen wird aktuell
# alerts.on_thesis_expiring_soon_days von check_thesis_deadlines)
alerts:
  on_position_over_5pct: true     # bool
  on_sector_over_15pct: true      # bool
  on_positions_exceed_max: true   # bool
  on_turnover_exceeded: true      # bool
  on_thesis_expiring_soon_days: 30  # int — Ablauf-Frist Thesen (Tage); gelesen von
                                    #   check_thesis_deadlines
  on_core_drift_over_threshold: true  # bool
  warn_on_position_over_4pct: true    # bool
  warn_on_correlation_to_core: 0.8    # float

# optional — Review-Rhythmus
review_schedule:
  quarterly_strategy_review: true       # bool
  annual_full_review: true              # bool
  triggers: ["life_event", "market_crash_20pct", "income_change_30pct"]  # list[str]

# optional — Core/Satellite-Klassifikation pro ISIN (Strategie-Intent, P1)
#
# Fehlt die Sektion, bleibt die bestehende Fallback-Kette aktiv (Roh-category
# -> etf_lookup -> unknown). Die Klassifikation ist ein Strategie-Feld, keine
# Rohdaten-Kategorie: sie überschreibt die Rohdaten nur bei "confirmed: true".
# Unbestätigte/fehlende Einträge werden wie "unknown" behandelt (fail-closed,
# keine blinde Heuristik). SUSE/Legacy wird NICHT automatisch klassifiziert.
holdings_classification:
  isins:
    IE00BK5BQT80:                      # ISIN -> Klassifikation (Beispiel)
      category: core                   # enum: core|satellite|legacy|unknown (Pflicht)
      confirmed: true                  # bool — nur confirmed gilt als Klassifikation
      source: user                     # str — etf_lookup|user|live (dokumentierend)
    IE00B4L5Y983:
      category: core
      confirmed: true
      source: user
    LU2722255754:                      # SUSE — illiquide Legacy (Beispiel)
      category: legacy
      confirmed: true
      source: user

# optional — Watchlist (Beobachtungspositionen, 21 Live-Einträge ab 11.09.2026)
#
# Nur ISIN/Name/Typ — KEINE Order-/Kontodaten. Diese Sektion ist der
# dokumentierte Startstand; der echte aktuelle Stand kommt bei jedem echten
# Pull via data/watchlist.json (Phase A) und überschreibt diese Startwerte
# nicht — sie dient als Reference + Seeds für den Loader.
watchlist:
  - isin: "IE00BK5BQT80"           # str — ISIN (Pflicht)
    name: "Vanguard FTSE All-World (Acc)"   # str — Anzeigename
    securityType: "ETF"            # str — Typ: ETF|STOCK|CRYPTO_ETP
  - isin: "US0378331005"
    name: "Apple Inc."
    securityType: "STOCK"
